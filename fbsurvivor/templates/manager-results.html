{% extends "base.html" %}
{% block content %}
    <div class="container">
        Results
    </div>
    <div class="container">
        {% for team in teams %}
            {{ team }}
            <form action="{% url 'result' season.year week.week_num team 'W' %}" method="POST" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="link-button">Won</button>
            </form>
            <form action="{% url 'result' season.year week.week_num team 'L' %}" method="POST" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="link-button">Lost</button>
            </form>
            <br><br>
        {% endfor %}
    </div>
{% endblock %}
