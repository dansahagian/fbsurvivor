{% extends "base.html" %}
{% block content %}
    <div class="container login">
        <p>Private NFL Survivor Pool</p>
        <p>Have an account?</p>
            <form action="{% url 'index' %}" method="POST">
                {% csrf_token %}
                {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
                <div class="email-form">
                    {{ form.identifier }}
                </div>
                <div class="email-form">
                    {{ form.password }}
                </div>
                <p class="form-hint">Leave the password blank to get a login code by email.</p>
                <div class="container">
                    <input class="submit-button blue-button" type="submit" value="Sign In" />
                </div>
            </form>
    </div>
{% endblock %}
