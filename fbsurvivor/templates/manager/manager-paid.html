{% extends "base.html" %}
{% block content %}
    <div class="container">
        Mark Paid
    </div>
    <div class="container">
        {% for player_status in player_statuses %}
            {% if not player_status.is_paid %}
                <div class="vertical-link">
                    <form action="{% url 'user_paid' season.year player_status.player.user.username %}" method="POST" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="link-button">{{ player_status.player.user.username }}</button>
                    </form>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endblock %}
