{% extends "base.html" %}
{% block content %}
    <div class="container login">
        <p>Create Player</p>
        <form action="{% url 'create_player' %}" method="POST">
            {% csrf_token %}
            <p>Username</p>
            <div class="email-form">
                {{ form.username }}
            </div>
            <p>Email</p>
            <div class="email-form">
                {{ form.email }}
            </div>
            <div class="container">
                <input class="submit-button blue-button" type="submit" value="Create User" />
            </div>
        </form>
    </div>
{% endblock %}
