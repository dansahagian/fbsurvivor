{% extends "base.html" %}
{% block content %}
    <div class="container">
        Players
    </div>
    <div class="container">
        {% for username in players %}
            <div class="vertical-link">
                <form action="{% url 'assume_player' username %}" method="POST" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="link-button">{{ username }}</button>
                </form>
            </div>
        {% endfor %}
    </div>
{% endblock %}
