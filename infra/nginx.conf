# This file is included in nginx's http context, so these SSL settings apply to every server below.
# Mozilla "intermediate" profile: https://ssl-config.mozilla.org/
# ssl_protocols and ssl_prefer_server_ciphers are set per server instead: the distro's stock
# /etc/nginx/nginx.conf already sets them at http level, and repeating them here is an error.
ssl_certificate             /etc/letsencrypt/live/fbsurvivor.com/fullchain.pem;
ssl_certificate_key         /etc/letsencrypt/live/fbsurvivor.com/privkey.pem;
ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache           shared:SSL:10m;
ssl_session_timeout         1d;
ssl_session_tickets         off;
server {
    listen          443 ssl;
    listen          [::]:443 ssl;
    http2           on;
    server_name     fbsurvivor.com;
    access_log      /var/log/nginx/fbsurvivor.access.log;
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   off;
    add_header      Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header      X-Frame-Options DENY always;
    add_header      X-Content-Type-Options nosniff always;
    add_header      Referrer-Policy strict-origin-when-cross-origin always;
    add_header      Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /static/ {
        alias /srv/www/fbsurvivor/static/;
        expires 7d;
    }
    location = /robots.txt {
        root /srv/www/fbsurvivor/static;
    }
    location ~ ^/(android-chrome-192x192\.png|android-chrome-512x512\.png|apple-touch-icon\.png|browserconfig\.xml|favicon\.ico|favicon-16x16\.png|favicon-32x32\.png|mstile-150x150\.png|safari-pinned-tab\.svg|site\.webmanifest)$ {
        root /srv/www/fbsurvivor/static/favicons;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen          443 ssl;
    listen          [::]:443 ssl;
    http2           on;
    server_name     www.fbsurvivor.com;
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   off;
    add_header      Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return          301 https://fbsurvivor.com$request_uri;
}

server {
    listen          80;
    listen          [::]:80;
    server_name     fbsurvivor.com www.fbsurvivor.com;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fbsurvivor.com$request_uri;
    }
}

# Catch-all: drop requests for any other Host (bare IP, scanners) before they reach Django.
server {
    listen          80 default_server;
    listen          [::]:80 default_server;
    server_name     _;
    return          444;
}

server {
    listen          443 ssl default_server;
    listen          [::]:443 ssl default_server;
    server_name     _;
    ssl_protocols   TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
