repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: ./dj lint
        language: script
        pass_filenames: false

      - id: format
        name: format
        entry: ./dj format
        language: script
        pass_filenames: false

      - id: types
        name: types
        entry: ./dj types
        language: script
        pass_filenames: false

      - id: tests
        name: tests
        entry: ./dj test
        language: script
        pass_filenames: false
